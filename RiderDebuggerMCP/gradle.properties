kotlin.code.style=official

# ----- Performance: JVM & Daemon -----
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache disabled: IntelliJ Platform Plugin may not fully support it,
# and gitVersion() runs external commands during configuration phase.
# Re-evaluate when upgrading to a newer IntelliJ Platform Plugin version.
# org.gradle.configuration-cache=true

# ----- Kotlin compiler -----
# Re-enable daemon and incremental compilation for fast local rebuilds.
# The Kotlin daemon keeps a warm JVM across builds; incremental compilation
# only recompiles changed files. Both are safe for this small codebase.
kotlin.daemon.enabled=true
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# ----- Plugin metadata -----
pluginGroup=com.vsdebugger
pluginName=AIDebugger Rider
pluginVersion=1.1.24
riderPlatformVersion=2024.1
platformPlugins=
org.jetbrains.intellij.platform.addDefaultIntellijPlatformDependencies=false
