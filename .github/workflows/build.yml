name: Build VSIX and Rider Plugin

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Default permissions for all jobs (restrictive by default)
permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run contract tests
      run: python -m unittest discover -s tests -p "test_*.py"

  build-vs:
    runs-on: windows-latest
    needs: contract-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore NuGet packages
      run: nuget restore VSDebuggerMCP/VSDebuggerMCP.csproj

    - name: Update version number
      shell: pwsh
      run: |
        # Extract version from tag or use run_number for dev builds
        if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
          $version = "${{ github.ref_name }}".TrimStart("v")
          Write-Host "Using tag version: $version"
        } else {
          $version = "1.0.${{ github.run_number }}"
          Write-Host "Using dev version: $version"
        }

        # Ensure version has at least 3 parts for VSIX (X.Y.Z)
        $versionParts = $version.Split(".")
        if ($versionParts.Count -lt 3) {
          $version = "$version.0"
        }

        # Assembly version needs 4 parts (X.Y.Z.W)
        $versionParts = $version.Split(".")
        if ($versionParts.Count -eq 3) {
          $assemblyVersion = "$version.0"
        } else {
          $assemblyVersion = $version
        }

        $shortSha = "${{ github.sha }}".Substring(0, 7)
        Write-Host "Final version: $version (assembly: $assemblyVersion, commit: $shortSha)"
        Write-Host "Working directory: $PWD"
        
        # Update source.extension.vsixmanifest using PowerShell 7's utf8NoBOM encoding
        $manifestPath = Join-Path $PWD "VSDebuggerMCP/source.extension.vsixmanifest"
        Write-Host "Manifest path: $manifestPath"
        Write-Host "File exists: $(Test-Path $manifestPath)"
        
        $manifest = Get-Content -Path $manifestPath -Raw
        Write-Host "First 50 chars before: $($manifest.Substring(0, [Math]::Min(50, $manifest.Length)))"
        # Use -creplace for case-sensitive replace to avoid changing xml declaration's lowercase "version"
        # Match Identity element's Version attribute specifically (format: Version="X.Y" or Version="X.Y.Z")
        $manifest = $manifest -creplace '(<Identity[^>]*Version=")[\d\.]+(")', "`${1}$version`${2}"
        # Write with UTF-8 no BOM - PowerShell 7 supports this natively
        Set-Content -Path $manifestPath -Value $manifest -Encoding utf8NoBOM -NoNewline
        
        # Minimal validation: fail fast if manifest version was not updated
        $updatedManifest = Get-Content -Path $manifestPath -Raw
        if ($updatedManifest -notmatch "<Identity[^>]*Version=`"$([regex]::Escape($version))`"") {
          throw "Failed to update VSIX manifest version to $version"
        }
        
        # Keep byte-level output to debug encoding/BOM issues on CI
        $bytes = [System.IO.File]::ReadAllBytes($manifestPath)
        Write-Host "First 10 bytes after write: $($bytes[0..9] -join ',')"
        
        # Update AssemblyInfo.cs with flexible pattern matching
        $assemblyInfoPath = Join-Path $PWD "VSDebuggerMCP/Properties/AssemblyInfo.cs"
        $assemblyInfo = Get-Content -Path $assemblyInfoPath -Raw
        $assemblyInfo = $assemblyInfo -replace 'AssemblyVersion\("[\d\.]+"\)', "AssemblyVersion(`"$assemblyVersion`")"
        $assemblyInfo = $assemblyInfo -replace 'AssemblyFileVersion\("[\d\.]+"\)', "AssemblyFileVersion(`"$assemblyVersion`")"
        Set-Content -Path $assemblyInfoPath -Value $assemblyInfo -Encoding utf8NoBOM -NoNewline

        # Validate AssemblyInfo version was updated
        $updatedAssemblyInfo = Get-Content -Path $assemblyInfoPath -Raw
        if ($updatedAssemblyInfo -notmatch "AssemblyVersion\(`"$([regex]::Escape($assemblyVersion))`"\)") {
          throw "Failed to update AssemblyVersion to $assemblyVersion"
        }
        Write-Host "AssemblyInfo.cs version updated successfully"

    - name: Build VSIX (Release)
      run: msbuild VSDebuggerMCP/VSDebuggerMCP.csproj /p:Configuration=Release /p:DeployExtension=false

    - name: Upload VSIX artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDebugger-VSIX
        path: |
          VSDebuggerMCP/bin/Release/VSDebuggerMCP.VS2022.vsix
          VSDebuggerMCP/bin/Release/VSDebuggerMCP.VS2026.vsix
        if-no-files-found: error

  build-rider:
    runs-on: windows-latest
    needs: contract-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: true

    - name: Update plugin version
      shell: pwsh
      run: |
        # Extract version from tag or use run_number for dev builds
        if ("${{ github.ref }}".StartsWith("refs/tags/v")) {
          $version = "${{ github.ref_name }}".TrimStart("v")
          Write-Host "Using tag version: $version"
        } else {
          $version = "1.0.${{ github.run_number }}"
          Write-Host "Using dev version: $version"
        }

        # Ensure version has at least 3 parts (X.Y.Z)
        $versionParts = $version.Split(".")
        if ($versionParts.Count -lt 3) {
          $version = "$version.0"
        }

        $shortSha = "${{ github.sha }}".Substring(0, 7)
        Write-Host "Final Rider plugin version: $version (commit: $shortSha)"

        $propsPath = "RiderDebuggerMCP/gradle.properties"
        $props = Get-Content -Path $propsPath -Raw
        $props = $props -replace 'pluginVersion=[\d\.]+', "pluginVersion=$version"
        Set-Content -Path $propsPath -Value $props -Encoding utf8NoBOM -NoNewline

        # Validate version was updated
        $updatedProps = Get-Content -Path $propsPath -Raw
        if ($updatedProps -notmatch "pluginVersion=$([regex]::Escape($version))") {
          throw "Failed to update Rider plugin version to $version"
        }
        Write-Host "Rider plugin version updated successfully"

    - name: Build Rider plugin
      run: .\\RiderDebuggerMCP\\gradlew.bat -p RiderDebuggerMCP buildPlugin

    - name: Upload Rider plugin artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIDebuggerRider-ZIP
        path: RiderDebuggerMCP/build/distributions/*.zip
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-vs, build-rider]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Download VSIX artifact
      uses: actions/download-artifact@v4
      with:
        name: AIDebugger-VSIX
        path: dist

    - name: Download Rider plugin artifact
      uses: actions/download-artifact@v4
      with:
        name: AIDebuggerRider-ZIP
        path: dist

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.vsix
          dist/*.zip
        generate_release_notes: true
