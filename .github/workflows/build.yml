name: Build VSIX and Rider Plugin

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-vs:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore VSDebuggerMCP/VSDebuggerMCP.csproj

    - name: Update version number
      shell: pwsh
      run: |
        $version = "1.0.${{ github.run_number }}"
        $assemblyVersion = "1.0.${{ github.run_number }}.0"
        Write-Host "Setting version to $version"
        
        # Update source.extension.vsixmanifest
        $manifestPath = "VSDebuggerMCP/source.extension.vsixmanifest"
        $manifest = Get-Content $manifestPath -Raw
        $manifest = $manifest -replace 'Version="1\.0"', "Version=`"$version`""
        Set-Content $manifestPath $manifest -NoNewline
        
        # Update AssemblyInfo.cs
        $assemblyInfoPath = "VSDebuggerMCP/Properties/AssemblyInfo.cs"
        $assemblyInfo = Get-Content $assemblyInfoPath -Raw
        $assemblyInfo = $assemblyInfo -replace 'AssemblyVersion\("1\.0\.0\.0"\)', "AssemblyVersion(`"$assemblyVersion`")"
        $assemblyInfo = $assemblyInfo -replace 'AssemblyFileVersion\("1\.0\.0\.0"\)', "AssemblyFileVersion(`"$assemblyVersion`")"
        Set-Content $assemblyInfoPath $assemblyInfo -NoNewline

    - name: Build VSIX (Release)
      run: msbuild VSDebuggerMCP/VSDebuggerMCP.csproj /p:Configuration=Release /p:DeployExtension=false

    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIDebugger-VSIX
        path: VSDebuggerMCP/bin/Release/VSDebuggerMCP.vsix
        if-no-files-found: error

  build-rider:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Rider plugin
      run: .\\RiderDebuggerMCP\\gradlew.bat -p RiderDebuggerMCP buildPlugin

    - name: Upload Rider plugin artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIDebuggerRider-ZIP
        path: RiderDebuggerMCP/build/distributions/*.zip
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-vs, build-rider]
    runs-on: windows-latest

    steps:
    - name: Download VSIX artifact
      uses: actions/download-artifact@v4
      with:
        name: AIDebugger-VSIX
        path: dist

    - name: Download Rider plugin artifact
      uses: actions/download-artifact@v4
      with:
        name: AIDebuggerRider-ZIP
        path: dist

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.vsix
          dist/*.zip
        generate_release_notes: true
