name: Build VSIX and Rider Plugin

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Default permissions for all jobs (restrictive by default)
permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run contract tests
      run: python -m unittest discover -s tests -p "test_*.py"

  build-vs:
    runs-on: windows-latest
    needs: contract-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0          # full history for git-based versioning

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          nuget-${{ runner.os }}-

    - name: Restore NuGet packages
      run: nuget restore VSDebuggerMCP/VSDebuggerMCP.csproj

    - name: Build VSIX (Release)
      run: msbuild VSDebuggerMCP/VSDebuggerMCP.csproj /p:Configuration=Release /p:DeployExtension=false

    - name: Upload VSIX artifacts
      uses: actions/upload-artifact@v4
      with:
        name: AIDebugger-VSIX
        path: |
          VSDebuggerMCP/bin/Release/VSDebuggerMCP.VS2022.vsix
          VSDebuggerMCP/bin/Release/VSDebuggerMCP.VS2026.vsix
        if-no-files-found: error

  build-rider:
    runs-on: ubuntu-latest
    needs: contract-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Fetch tags for versioning
      run: git fetch --tags --no-recurse-submodules

    - name: Setup JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        validate-wrappers: true
        cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}
        # Rider SDK is cached separately below with a more stable key.
        # Exclude it from setup-gradle's cache to avoid redundant storage.
        gradle-home-cache-excludes: |
          caches/modules-2/files-2.1/com.jetbrains.intellij.rider

    - name: Cache Rider SDK
      uses: actions/cache@v4
      with:
        path: ~/.gradle/caches/modules-2/files-2.1/com.jetbrains.intellij.rider
        key: rider-sdk-${{ hashFiles('RiderDebuggerMCP/gradle.properties') }}
        restore-keys: |
          rider-sdk-

    - name: Build Rider plugin
      run: ./RiderDebuggerMCP/gradlew -p RiderDebuggerMCP buildPlugin --no-daemon
      env:
        GRADLE_OPTS: -Dorg.gradle.daemon=false

    - name: Upload Rider plugin artifact
      uses: actions/upload-artifact@v4
      with:
        name: AIDebuggerRider-ZIP
        path: RiderDebuggerMCP/build/distributions/*.zip
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-vs, build-rider]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download VSIX artifact
      uses: actions/download-artifact@v4
      with:
        name: AIDebugger-VSIX
        path: dist

    - name: Download Rider plugin artifact
      uses: actions/download-artifact@v4
      with:
        name: AIDebuggerRider-ZIP
        path: dist

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          dist/*.vsix
          dist/*.zip
        generate_release_notes: true
