name: Build VSIX

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Default permissions for all jobs (restrictive by default)
permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0          # full history + tags for Stamp-Version dry-run tests

    - name: Setup Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run contract tests
      run: python -m unittest discover -s tests -p "test_*.py"

    - name: Validate bundled dependency manifest
      shell: powershell
      run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/Update-WheelManifest.ps1 -VerifyOnly

  build-vs:
    runs-on: windows-latest
    needs: contract-tests

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0          # full history for git-based versioning

    - name: Validate canonical release tag
      if: startsWith(github.ref, 'refs/tags/')
      shell: pwsh
      run: |
        $result = @(./tools/Assert-ReleaseRef.ps1 -Tag "${{ github.ref_name }}" -ExpectedCommit "${{ github.sha }}")
        $version = $result[-1]
        "AIDB_EXPECTED_RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce # v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@d105a947828025cd7a980103c35ba2bfae586d0f # v2

    - name: Setup Python for bundled runtime smoke tests
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.14'

    - name: Restore NuGet packages
      run: nuget restore VSDebuggerMCP/VSDebuggerMCP.csproj

    - name: Build VSIX (Release)
      run: msbuild VSDebuggerMCP/VSDebuggerMCP.csproj /p:Configuration=Release /p:DeployExtension=false

    - name: Sign tagged VSIX packages
      if: startsWith(github.ref, 'refs/tags/')
      shell: powershell
      env:
        VSIX_SIGNING_CERT_BASE64: ${{ secrets.VSIX_SIGNING_CERT_BASE64 }}
        VSIX_SIGNING_CERT_PASSWORD: ${{ secrets.VSIX_SIGNING_CERT_PASSWORD }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:VSIX_SIGNING_CERT_BASE64) -or
            [string]::IsNullOrWhiteSpace($env:VSIX_SIGNING_CERT_PASSWORD)) {
          throw "Tagged releases require VSIX_SIGNING_CERT_BASE64 and VSIX_SIGNING_CERT_PASSWORD secrets."
        }
        $pfxPath = Join-Path $env:RUNNER_TEMP "aidb-vsix-signing.pfx"
        $toolPath = Join-Path $env:RUNNER_TEMP "sign-cli"
        [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:VSIX_SIGNING_CERT_BASE64))
        $password = ConvertTo-SecureString $env:VSIX_SIGNING_CERT_PASSWORD -AsPlainText -Force
        $certificate = $null
        $importedThumbprints = @()
        $beforeThumbprints = @(
          Get-ChildItem -LiteralPath Cert:\CurrentUser\My |
            Where-Object { $_.Thumbprint } |
            ForEach-Object { $_.Thumbprint.ToUpperInvariant() }
        )
        try {
          $importedCertificates = @(Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password)
          $importedThumbprints = @(
            $importedCertificates |
              Where-Object {
                $_ -and $_.Thumbprint -match '^[0-9A-Fa-f]{40,128}$' -and
                $beforeThumbprints -notcontains $_.Thumbprint.ToUpperInvariant()
              } |
              ForEach-Object { $_.Thumbprint.ToUpperInvariant() } |
              Select-Object -Unique
          )
          $signingCertificates = @($importedCertificates | Where-Object { $_ -and $_.HasPrivateKey })
          if ($signingCertificates.Count -ne 1 -or
              $signingCertificates[0].Thumbprint -notmatch '^[0-9A-Fa-f]{40,128}$') {
            throw "The PFX must import exactly one signing certificate with a valid thumbprint."
          }
          $certificate = $signingCertificates[0]
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          try {
            $certificateFingerprint = [BitConverter]::ToString(
              $sha256.ComputeHash($certificate.RawData)
            ).Replace("-", "")
          }
          finally {
            $sha256.Dispose()
          }
          $signPackage = Join-Path $env:RUNNER_TEMP "sign.0.9.1-beta.26330.1.nupkg"
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/sign/0.9.1-beta.26330.1/sign.0.9.1-beta.26330.1.nupkg" -OutFile $signPackage
          $expectedSignPackageSha256 = "8cbbf52e90a6823feccf0fc054c4d3881d88c654db8f147912097003d387d65e"
          $actualSignPackageSha256 = (Get-FileHash -LiteralPath $signPackage -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSignPackageSha256 -ne $expectedSignPackageSha256) {
            throw "sign tool package SHA-256 mismatch: $actualSignPackageSha256"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory($signPackage, $toolPath)
          $sign = Join-Path $toolPath "tools/net8.0/any/sign.dll"
          foreach ($vsix in Get-ChildItem VSDebuggerMCP/bin/Release/VSDebuggerMCP.VS*.vsix) {
            & dotnet $sign code certificate-store -cfp $certificateFingerprint -d "AIDebugger Visual Studio Extension" -t "http://timestamp.acs.microsoft.com/" $vsix.FullName
            if ($LASTEXITCODE -ne 0) { throw "Sign CLI failed for $($vsix.FullName)" }
          }
        }
        finally {
          foreach ($thumbprint in $importedThumbprints) {
            if ($thumbprint -match '^[0-9A-Fa-f]{40,128}$') {
              try {
                Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $thumbprint) -Force -ErrorAction Stop
              }
              catch {
                Write-Warning ("Failed to remove imported signing certificate " + $thumbprint + ": " + $_.Exception.Message)
              }
            }
          }
          Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
        }

    - name: Run C# protocol infrastructure tests
      run: dotnet test VSDebuggerMCP.Tests/VSDebuggerMCP.Tests.csproj -c Release

    - name: Run live Visual Studio Experimental Instance smoke test
      shell: powershell
      run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/Invoke-LiveVsSmoke.ps1

    - name: Verify VSIX contents and versions
      shell: powershell
      run: |
        $arguments = @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "tools/Verify-Vsix.ps1")
        if ("${{ startsWith(github.ref, 'refs/tags/') }}" -eq "true") {
          $arguments += @("-RequireSignature", "-ExpectedVersion", $env:AIDB_EXPECTED_RELEASE_VERSION)
        }
        & powershell @arguments

    - name: Generate VSIX SHA-256 records
      shell: powershell
      run: |
        foreach ($vsix in Get-ChildItem VSDebuggerMCP/bin/Release/VSDebuggerMCP.VS*.vsix) {
          $hash = (Get-FileHash -LiteralPath $vsix.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText($vsix.FullName + ".sha256", "$hash  $($vsix.Name)`n", [Text.UTF8Encoding]::new($false))
        }

    - name: Generate and validate SPDX SBOM
      shell: powershell
      run: |
        $sbomTool = Join-Path $env:RUNNER_TEMP "sbom-tool.exe"
        Invoke-WebRequest -Uri "https://github.com/microsoft/sbom-tool/releases/download/v4.1.5/sbom-tool-win-x64.exe" -OutFile $sbomTool
        $expectedSbomToolSha256 = "625767b371b7fdd58f40f618b8a86da0247a33c89e419039c86b4edba1dad4b5"
        $actualSbomToolSha256 = (Get-FileHash -LiteralPath $sbomTool -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($actualSbomToolSha256 -ne $expectedSbomToolSha256) {
          throw "sbom-tool v4.1.5 SHA-256 mismatch: $actualSbomToolSha256"
        }
        if ($env:AIDB_EXPECTED_RELEASE_VERSION) {
          $version = $env:AIDB_EXPECTED_RELEASE_VERSION
        }
        else {
          $versionOutput = & powershell -NoProfile -ExecutionPolicy Bypass -File tools/Stamp-Version.ps1 -DryRun -Target VS
          if (($versionOutput -join "`n") -notmatch 'Stamp-Version:\s+([0-9]+(?:\.[0-9]+){2,3})') { throw "Unable to determine SBOM version" }
          $version = $Matches[1]
        }
        & $sbomTool generate -b VSDebuggerMCP/bin/Release -bc . -pn AIDebugger-VS -pv $version -ps lonelyWaiting -nsb https://github.com/lonelyWaiting/AIDebugger
        if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed" }
        & $sbomTool validate -b VSDebuggerMCP/bin/Release -o VSDebuggerMCP/bin/Release/sbom-validation.json -mi SPDX:2.2
        if ($LASTEXITCODE -ne 0) { throw "SBOM validation failed" }

    - name: Upload VSIX artifacts
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: AIDebugger-VSIX
        path: |
          VSDebuggerMCP/bin/Release/VSDebuggerMCP.VS2022.vsix
          VSDebuggerMCP/bin/Release/VSDebuggerMCP.VS2026.vsix
          VSDebuggerMCP/bin/Release/VSDebuggerMCP.VS2022.vsix.sha256
          VSDebuggerMCP/bin/Release/VSDebuggerMCP.VS2026.vsix.sha256
          VSDebuggerMCP/bin/Release/_manifest/spdx_2.2/manifest.spdx.json
        if-no-files-found: error

  release-vs:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-vs
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download VSIX artifact
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        name: AIDebugger-VSIX
        path: dist

    - name: Verify published VSIX checksum records
      shell: pwsh
      run: |
        $packages = @(Get-ChildItem dist -Recurse -Filter *.vsix)
        if ($packages.Count -ne 2) { throw "Expected exactly two VSIX release packages" }
        foreach ($vsix in $packages) {
          $record = $vsix.FullName + ".sha256"
          if (-not (Test-Path -LiteralPath $record -PathType Leaf)) { throw "Missing checksum record: $record" }
          $declared = ((Get-Content -LiteralPath $record -Raw) -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $vsix.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($declared -ne $actual) { throw "Checksum record mismatch for $($vsix.Name)" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $archive = [IO.Compression.ZipFile]::OpenRead($vsix.FullName)
          try {
            $entry = $archive.GetEntry("extension.vsixmanifest")
            if ($null -eq $entry) { throw "$($vsix.Name) has no extension.vsixmanifest" }
            $reader = [IO.StreamReader]::new($entry.Open())
            try { [xml]$manifest = $reader.ReadToEnd() } finally { $reader.Dispose() }
            $expectedVersion = "${{ github.ref_name }}".Substring(1)
            if ([string]$manifest.PackageManifest.Metadata.Identity.Version -ne $expectedVersion) {
              throw "$($vsix.Name) version does not match release tag $expectedVersion"
            }
          }
          finally { $archive.Dispose() }
        }

    - name: Create GitHub Release with VS artifacts
      uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
      with:
        files: |
          dist/*.vsix
          dist/*.vsix.sha256
          dist/**/manifest.spdx.json
        generate_release_notes: true
